[project]
name = "bearings"
version = "0.1.0"
description = "A learned context layer for coding agents, on HydraDB"
readme = "README.md"
authors = [
    { name = "kruxarth", email = "kruxarth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pyarrow>=26.0.1",
    "rank-bm25>=0.2.2",
]

[project.scripts]
handoffdb = "bearings.cli:main"
handoffdb-web = "bearings.web:main"
handoffdb-mcp = "bearings.mcp_server:main"
bearings = "bearings.cli:main"
bearings-mcp = "bearings.mcp_server:main"
bearings-web = "bearings.web:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
